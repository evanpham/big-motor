[project]
name = "basic_mag_analysis"
version = "0.1.0"
description = "Magnetic-circuit analysis for axial-flux SRM torque"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
